# ===============================
# Application
# ===============================
spring.application.name=drukbazaars
server.port=${PORT:8080}

# ===============================
# Secrets (passwords, keys) are NOT in this file, because it is in git.
#  - On a developer's computer: Inventory_System/secrets.properties (git ignores it), for example
#        spring.datasource.password=...
#  - On a server: environment variables (SPRING_DATASOURCE_PASSWORD, SPRING_MAIL_PASSWORD, ...)
#    or a secrets.properties next to the jar. See DEPLOY.md.
# ===============================
# Read from the folder the app starts in, and from Inventory_System/ (IntelliJ starts it one folder up, in Inventory/)
spring.config.import=optional:file:./secrets.properties,optional:file:./Inventory_System/secrets.properties

# ===============================
# MySQL database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Tables: built and upgraded by Flyway from src/main/resources/db/migration (V1__..., V2__..., in order).
# Hibernate only CHECKS that the tables match the code at start-up and never changes them.
# A database that existed before Flyway is marked as version 1 the first time (run
# database/upgrade-existing-database.sql on it once first). See database/README.md.
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# (No dialect line needed: Hibernate 7 detects MySQL automatically)

# ===============================
# Static files & uploaded images
# ===============================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Upload sizes (Spring's default is only 1MB per file): product photos and partner documents up to 6MB
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=25MB

# Seller and driver identity documents: kept OUTSIDE the public folders, only admins can open them
app.private-upload-dir=private-uploads
# Where uploaded files are kept (product photos, sellers' and drivers' documents):
#   disk      (default) the uploads/ and private-uploads/ folders
#   database  inside MySQL (table stored_files). Needed where the server's disk does not last, such as a free
#             Render web service (set APP_FILES_STORE=database there). Files already in the folders are copied in.
app.files.store=disk

# ===============================
# Login session cookie (the live server switches "secure" on, see application-prod.properties)
# ===============================
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
# Signed out after this long WITHOUT any activity (an open, visible page keeps the sign-in alive).
# Sign-ins are kept in the database (Spring Session, tables from db/migration/V3), so a restart signs nobody out.
server.servlet.session.timeout=${SESSION_TIMEOUT:4h}

# ===============================
# The website's address, for links in emails (password reset, order updates)
# ===============================
app.public-url=http://localhost:4200

# ===============================
# Email: off here (emails are written to the log). On the server set app.mail.enabled=true and the
# SMTP server: spring.mail.host, spring.mail.port, spring.mail.username, spring.mail.password
# ===============================
app.mail.enabled=false
app.mail.from=DP DrukBazaars <no-reply@drukbazaars.bt>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000

# ===============================
# Text messages (SMS): off here (messages, with the "forgot password" codes, are written to the log).
# On the server: app.sms.enabled=true and either
#   app.sms.provider=url     app.sms.url=https://...{to}...{text}   (a bulk SMS account, see SmsService)
#   app.sms.provider=twilio  app.sms.twilio.account-sid, app.sms.twilio.auth-token, app.sms.twilio.from
# ===============================
app.sms.enabled=false
app.sms.provider=url
app.sms.country-code=975

# ===============================
# Online payments
#   Paying from a bank account with a code sent to the phone (page /pay/bank):
#     app.payments.bank.mode=test  TEST MODE: no bank is contacted, no money moves, no text is sent.
#                                  The code is always 123456; an account ending 0000 is "not found",
#                                  9999 has "not enough money", 5555 = the bank never answers (staff check).
#                                  Refused on the live site.
#     app.payments.bank.mode=rma   REAL money through the RMA Payment Gateway (RmaBankGatewayClient). Needs, from the
#                                  merchant kit RMA gives DP DrukBazaars:
#                                    app.payments.bank.rma.url                    the RMA test (UAT) address first, then live
#                                    app.payments.bank.rma.beneficiary-id         DP DrukBazaars' merchant id
#                                    app.payments.bank.rma.beneficiary-bank-code  01 unless RMA says otherwise
#                                    app.payments.bank.rma.private-key            path to DP DrukBazaars' private key (PEM)
#                                    app.payments.bank.rma.public-key             path to the RMA public key / certificate
#                                  Put them in secrets.properties, never in this file.
#     app.payments.bank.mode=off   not offered
#   app.payments.bank.banks        the banks to choose from: RMA bank id:short name:full name, comma separated
#   app.payments.sandbox.enabled   the older one-click test page (Pay / Fail / Cancel); off now that the bank flow exists
# ===============================
app.payments.bank.mode=test
app.payments.bank.banks=1010:BoB:Bank of Bhutan,1020:BNB:Bhutan National Bank,1030:DPNB:Druk PNB Bank,1040:TBank:T Bank,1050:BDBL:Bhutan Development Bank,1060:DK:DK Bank
app.payments.sandbox.enabled=false

# ===============================
# Logging (DEBUG is noisy; the live server uses INFO)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# JSON
# ===============================
# Prevent Jackson from trying to serialize uninitialized Hibernate proxies
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# Order board (/admin/orders): an order is "late" when it stays longer than this in a step (minutes)
# ===============================
app.orders.target.verify-minutes=120
app.orders.target.pack-minutes=240
app.orders.target.pickup-minutes=120
app.orders.target.deliver-minutes=180
# an unpaid order older than this can be cancelled from the board
app.orders.target.unpaid-minutes=1440
# "Pick up myself": a packed order the customer has not collected for this long is marked late (3 days)
app.orders.target.collect-minutes=4320

app.returns.window-days=7
app.returns.roles=ADMIN,MANAGER
