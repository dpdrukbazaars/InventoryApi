
# =====================================
# MySQL Integration Testing Only
# =====================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/inventory_session_test?serverTimezone=UTC
spring.datasource.username=inventory_test
spring.datasource.password=${INVENTORY_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway creates the schema from V1 onwards
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Hibernate validates instead of creating tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway manages Spring Session tables
spring.session.jdbc.initialize-schema=never

# No real outgoing communications
app.mail.enabled=false
app.mail.log-body=false
app.sms.enabled=false
app.sms.log-text=false

# No test payment gateway activity
app.payments.bank.mode=off
app.payments.sandbox.enabled=false

# Reduce test logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
